[project]
name = "goose-temporal-pipeline"
version = "0.1.0"
description = "Pipeline de développement automatisé avec Temporal et Goose CLI"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
