version: 1.0.0
title: generate_feature
description: Développer une fonctionnalité à partir d'une tâche projet

instruction: |
  Tu es un architecte d'application expert.

  Objectifs :

  Sélectionner la prochaine tâche à implémenter.
  Analyser la base de code et l'architecture existantes.
  Concevoir et implémenter la fonctionnalité.
  Produire la documentation.
  Créer une branche git dédiée.
  Committer et pousser les modifications.

  Contraintes obligatoires :

  NE JAMAIS modifier aucun fichier recette (*.yaml) situé sous .goose/.
  NE JAMAIS modifier une définition de tâche sauf instruction explicite ci-dessous.
  Préserver la rétrocompatibilité autant que possible.
  Suivre l'architecture existante, les normes de codage et les conventions.
  Écrire ou mettre à jour les tests lorsque cela s'applique.
  S'assurer que le projet compile avec succès avant de commit.
  Créer ou mettre à jour la documentation technique.

  Prérequis :

  Le dépôt Git existe déjà.
  L'arborescence de travail Git est propre (exclure le répertoire recipes) avant de commencer.
  L'authentification GitHub via gh est disponible.
  Les outils de développement requis sont installés.
  Les dépendances du projet peuvent être résolues.
  Le répertoire de tâches existe.

sub_recipes:

  - name: task_analysis
    path: ./sub_recipes/task_analysis.yaml
    description: "Analyse approfondie : objectifs, contraintes, dépendances, risques"

  - name: task_feature_design
    path: ./sub_recipes/task_feature_design.yaml
    description: "Conception de l'implémentation avec justification"

  - name: git_branch_feature_creation
    path: ./sub_recipes/git_branch_feature_creation.yaml
    description: "Création de la branche feature avec vérification"

  - name: task_feature_implementation
    path: ./sub_recipes/task_feature_implementation.yaml
    description: "Implémentation du code, tests et documentation"

  - name: task_validation
    path: ./sub_recipes/task_validation.yaml
    description: "Validation complète : formatage, linting, tests, build"

  - name: git_commit_push
    path: ./sub_recipes/git_commit_push.yaml
    description: "Commit et push sécurisés avec vérification du dépôt"

prompt: |
  Suivre le flux de travail exactement.

  -- Étape 0 - Validation des prérequis

  Vérifier les prérequis suivants :

    1. Exécuter `git status` et vérifier que le résultat est propre
    2. Exécuter `gh auth status` et vérifier que l'authentification réussit
    3. Vérifier que le fichier `.goose/prompts/01-to_do` existe
    4. Vérifier qu'au moins un fichier de tâche est disponible dans `.goose/prompts/01-to_do/`

  Si un prérequis manque :
  - Arrêter immédiatement
  - Signaler clairement quel prérequis est manquant
  - Ne pas continuer

  Si tous les prérequis sont satisfaits :
  - Confirmer la validation réussie
  - Continuer vers l'étape suivante

  Arrêter immédiatement et signaler tout prérequis manquant.

  -- Étape 1 - Sélection de la tâche

  Sélectionner la première tâche disponible :

    1. Lister les fichiers dans `.goose/prompts/01-to_do/`
    2. Filtrer les fichiers correspondant au pattern : `^\d{2}-\d{3}_.*`
    3. Trier les fichiers alphabétiquement
    4. Sélectionner le premier fichier

  Enregistrer :
  - `task_file` : nom du fichier sélectionné
  - `task_name` : nom de la tâche (extrait du nom de fichier)

  Si aucun fichier ne correspond, signaler l'erreur et arrêter.

  -- Étape 2 - Analyse de la tâche

  Exécuter la sous-recette `task_analysis`

  -- Étape 3 - Conception de la fonctionnalité

  Exécuter la sous-recette `task_design`

  -- Étape 4 - Création de la branche feature

  Exécuter la sous-recette `git_branch_feature_creation`

  -- Étape 5 - Implémentation de la fonctionnalité

  Exécuter la sous-recette `task_feature_implementation`

  -- Étape 6 - Validation

  Exécuter la sous-recette `task_validation`

  -- Étape 7 - Mise à jour des métadonnées

  - Si le fichier de tâche contient une section metadata, ajouter :
    `feature_branch: feature/<task_name_slug>`
  - Ne pas modifier le contenu fonctionnel de la tâche

  -- Étape 8 - Commit

  Exécuter la sous-recette `git_commit_push` avec l'action `commit`

  -- Étape 9 - Push

  Exécuter la sous-recette `git_commit_push` avec l'action `push`

  -- Étape 10 - Déplacement de la tâche

  Exécuter la sous-recette `task_movement` :
  - Déplacer le fichier de tâche :
    `.goose/prompts/01-to_do/<task_file>` vers
    `.goose/prompts/02-to_review/<task_file>`

  -- Étape 11 - Commit final

  Exécuter la sous-recette `git_commit_push` avec l'action `commit_chore` :
  - Committer le déplacement : `chore: move task <task_name> to review`

  -- Étape 12 - Création de l'ADR

  - Créer le fichier dans `docs/adr/`
  - Remplir le template avec :
    - Titre de l'ADR
    - Date
    - Statut : Accepted
    - Contexte et problèmes
    - Décision prise
    - Conséquences positives et négatives
  - Nommage du fichier ADR : adr-<aaaaMMjj>-<task_name_slug>.md

  -- Étape 13 - Création de la Pull Request

  - Créer ou utiliser la pull request depuis la branche `feature/<task_name_slug>`
  - Titre : `feat: <task_name>`
  - Inclure les références à l'ADR et au plan d'implémentation

extensions:
  - name: analyze
    enabled: true
    type: platform
    description: "Analyser la structure du code avec tree-sitter : aperçus de répertoires, détails de fichiers, graphes d'appels de symboles"
    display_name: Analyze
    bundled: true
    available_tools: []

  - name: summarize
    enabled: true
    type: platform
    description: Charger des fichiers/répertoires et obtenir un résumé LLM en un seul appel
    display_name: Summarize
    bundled: true
    available_tools: []

  - name: developer
    enabled: true
    type: platform
    description: Écrire et modifier des fichiers, et exécuter des commandes shell
    display_name: Developer
    bundled: true
    available_tools: []

  - name: code_execution
    enabled: true
    type: platform
    description: Goose effectuera les appels d'extension via l'exécution de code, permettant d'économiser des tokens
    display_name: Code Mode
    bundled: true
    available_tools: []

  - name: orchestrator
    enabled: true
    type: platform
    description: "Gérer les sessions d'agents : lister, afficher, démarrer, envoyer des messages, interrompre et arrêter les agents"
    display_name: Orchestrator
    bundled: true
    available_tools: []
