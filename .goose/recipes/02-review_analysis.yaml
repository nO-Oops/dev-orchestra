version: 1.0.0
title: Revue de Pull Request
description: |
  Revue complète de la pull request couvrant l'architecture, la qualité du code, la sécurité,
  les tests, les performances et la compatibilité API.

instruction: |
  Tu ne dois pas modifier les fichiers de l'application.
  Tu rédigera l'analyse dans le commentaire de la pull request. Utilise la branche <branch name value>
  Tu devrais formuler des suggestions concernant les options à choisir.
  Ne pas examiner les fichiers des répertoires 00-prepare, 01-to_do, 04-close
  Privilégie la lecture des fichiers locaux plutôt que ceux du dépôt Git

sub_recipes:
  - name: context
    path: sub_recipes/code_context_analysis_pull_request.yaml

  - name: code_quality
    path: sub_recipes/code_quality_analysis.yaml

  - name: testing
    path: sub_recipes/code_test_review_analysis.yaml

  - name: api_compatibility
    path: sub_recipes/code_api_compatibility.yaml

prompt: |
  Analyser l'application située dans le répertoire courant

  Exécuter toutes les sous-recettes et consolider les résultats.
  Utiliser la valeur du nom de branche définie dans le fichier .goose/prompts/02-to_review sous le nom 'feature_branch'
  Produire :

    - Résumé exécutif
    - Résultats critiques
    - Résultats à haute priorité
    - Améliorations suggérées
    - Recommandation finale

    La recommandation doit être l'une des suivantes :
      - APPROVE
      - APPROVE_WITH_COMMENTS
      - REQUEST_CHANGES

  # Étapes finales :
    - Copier le rapport d'évaluation complet et le rédiger dans un commentaire de la pull request avec le nom de branche feature/<task_name_slug>
    - Enregistrer le contenu dans le fichier '.goose/review/<branch name value>-final_review.md'
    - Utiliser la commande 'gh pr comment feature/<task_name_slug> --body "cat $(.goose/review/feature/<task_name_slug>-final_review.md)"'
