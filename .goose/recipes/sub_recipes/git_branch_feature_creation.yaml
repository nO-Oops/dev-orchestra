version: 1.0.0
title: Branch Creation
description: Création de la branche feature avec vérification

instruction: |
  Créer une branche feature avec un nom sécurisé et vérifier sa création.

prompt: |
  Générer un nom de branche sécurisé :

  Règles de génération :
  - Tout en minuscules
  - Remplacer les espaces par "-"
  - Remplacer les caractères spéciaux
  - Ajouter la date avant le nom de la feature, au format aaaaMMjj

  Nom de branche : `feature/<aaaaMMjj>_<feature_task_name>`

  Exemple :
  ```bash
  git checkout -b feature/20260902_filter-de-recherche
