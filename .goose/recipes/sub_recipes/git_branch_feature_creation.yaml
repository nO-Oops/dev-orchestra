version: 1.0.0
title: Branch Creation
description: Création de la branche feature avec vérification

instruction: |
  Créer une branche feature avec un nom sécurisé et vérifier sa création.

prompt: |
  Générer un nom de branche sécurisé :

  Règles de génération :
  - Tout en minuscules
  - Remplacer les espaces par "-"
  - Remplacer les caractères spéciaux par "-"
  - Remplacer les caractères accentués par le caractère sans accent

  Nom de branche : `feature/<feature_task_name>`

  Exemple :
  ```bash
  git checkout -b feature/ajout-de-filtres-de-recherche
